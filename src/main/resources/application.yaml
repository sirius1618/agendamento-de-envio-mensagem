spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agendamento_mensagens
    username: admin
    password: 123
    driver-class-name: org.postgresql.Driver

  # Gerenciamento de tempo de conexões
    hikari:
      maximum-pool-size: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    org:
      springframework:
        data: INFO
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
      flywaydb: INFO

jackson:
  time-zone: America/Sao_Paulo